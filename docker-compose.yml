services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-adventureworks
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  babelfish:
    image: jonathanpotts/babelfishpg:latest
    container_name: postgres-babelfish
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: babelfish
      BABELFISH_PASSWORD: "${BABELFISH_PASSWORD}"

    ports:
      - "5432:5432"
      - "1434:1433"

    volumes:
      - babelfish_data:/var/lib/postgresql/data

volumes:
  sqlserver_data:
  babelfish_data:
