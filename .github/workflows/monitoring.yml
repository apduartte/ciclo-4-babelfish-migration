name: Monitoring Pipeline

# =========================
# EVENTOS QUE DISPARAM O PIPELINE
# =========================
on:

  workflow_dispatch:

  push:
    branches:
      - main
      - feature/babelfish-migration-validation

# =========================
# PERMISSÕES NECESSÁRIAS
# =========================
permissions:
  id-token: write
  contents: read

# =========================
# JOB PRINCIPAL
# =========================
jobs:

  monitoring:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # ETAPA 1 — CHECKOUT
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # =========================
      # ETAPA 2 — DEBUG GITHUB CONTEXT
      # =========================
      - name: Debug GitHub Context

        run: |

          echo "========================================="
          echo "DEBUG GITHUB CONTEXT"
          echo "========================================="

          echo ""
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Ref:"
          echo "${{ github.ref }}"

          echo ""
          echo "Event:"
          echo "${{ github.event_name }}"

          echo ""
          echo "Actor:"
          echo "${{ github.actor }}"

          echo ""
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo ""
          echo "Status:"
          echo "GitHub Context validado com sucesso."

          echo "========================================="

      # =========================
      # ETAPA 3 — AUTENTICAÇÃO AWS
      # =========================
      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::597819997995:role/GitHubActionsRole
          aws-region: us-east-1

      # =========================
      # ETAPA 4 — VALIDAÇÃO DA SESSÃO AWS
      # =========================
      - name: Validate AWS Session

        run: |

          echo "========================================="
          echo "VALIDANDO SESSÃO AWS"
          echo "========================================="

          echo ""
          echo "Região AWS configurada:"
          echo $AWS_REGION

          echo ""
          echo "Validando identidade IAM autenticada..."
          aws sts get-caller-identity

          echo ""
          echo "Status:"
          echo "Autenticação AWS validada com sucesso."

          echo "========================================="

      # =========================
      # ETAPA 5 — VALIDAR REGIÃO AWS
      # =========================
      - name: Validate Current AWS Region

        run: |

          echo "========================================="
          echo "VALIDANDO REGIÃO AWS CONFIGURADA"
          echo "========================================="

          echo ""
          echo "Região atualmente configurada no runner:"
          echo $AWS_REGION

          echo ""
          echo "Status:"
          echo "Região AWS validada com sucesso."

          echo "========================================="

      # =========================
      # ETAPA 6 — LISTAR BUCKETS S3
      # =========================
      - name: List S3 Buckets

        run: |

          echo "========================================="
          echo "VALIDANDO ACESSO AO AMAZON S3"
          echo "========================================="

          echo ""
          echo "Listando buckets S3 disponíveis na conta AWS..."

          aws s3 ls

          echo ""
          echo "Status:"
          echo "Conectividade com Amazon S3 validada com sucesso."

          echo "========================================="