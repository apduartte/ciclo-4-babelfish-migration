name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify hardcoded secrets
        run: |
          echo "Scanning repository for potential hardcoded secrets..."

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude=*.md \
            "(password\s*=|passwd\s*=|pwd\s*=|secret\s*=|api_key\s*=|token\s*=)" .; then

            echo "Potential hardcoded secret detected."
            exit 1
          else
            echo "No hardcoded secrets detected."
          fi