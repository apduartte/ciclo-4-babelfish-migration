name: SAST Security Scan

# =========================================================
# VARIÁVEIS GLOBAIS
# =========================================================
env:

  # Compatibilidade com GitHub Actions runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# =========================================================
# EVENTOS QUE DISPARAM O PIPELINE
# =========================================================
on:

  # Executa automaticamente em pushes na branch main
  push:
    branches:
      - main

  # Executa automaticamente em Pull Requests
  pull_request:
    branches:
      - main

# =========================================================
# JOBS
# =========================================================
jobs:

  sast:

    # Nome exibido no GitHub Actions
    name: Static Application Security Testing

    # Runner Ubuntu oficial
    runs-on: ubuntu-latest

    # =====================================================
    # PERMISSÕES
    # =====================================================
    permissions:

      # Permissão mínima necessária
      contents: read

      # Necessário para integração entre actions
      actions: read

    # =====================================================
    # ETAPAS
    # =====================================================
    steps:

      # =====================================================
      # ETAPA 1 — CHECKOUT
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # ETAPA 2 — SAST COM SEMGREP
      # =====================================================
      - name: Run Semgrep Security Scan

        uses: semgrep/semgrep-action@v1

        with:

          # Regras automáticas da comunidade
          config: auto

        env:

          # Token opcional Semgrep Platform
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}