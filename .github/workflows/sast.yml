name: SAST Security Scan

# =========================================================
# VARIÁVEIS GLOBAIS
# =========================================================
env:

  # Compatibilidade com GitHub Actions runtime
  # evitando warnings relacionados ao Node.js 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# =========================================================
# EVENTOS QUE DISPARAM O PIPELINE
# =========================================================
on:

  # Executa automaticamente em pushes na branch main
  push:
    branches:
      - main

  # Executa automaticamente em Pull Requests
  # direcionados para branch main
  pull_request:
    branches:
      - main

# =========================================================
# JOBS
# =========================================================
jobs:

  sast:

    # Nome exibido no GitHub Actions
    name: Static Application Security Testing

    # Runner oficial Ubuntu
    runs-on: ubuntu-latest

    # =====================================================
    # PERMISSÕES NECESSÁRIAS
    # =====================================================
    permissions:

      # Permissão de leitura do repositório
      contents: read

      # Permissão para publicar resultados SARIF
      # na aba Security do GitHub
      security-events: write

      # Necessário para integração entre actions
      actions: read

    # =====================================================
    # ETAPAS
    # =====================================================
    steps:

      # =====================================================
      # ETAPA 1 — CHECKOUT DO REPOSITÓRIO
      # =====================================================
      - name: Checkout Repository

        # Action oficial GitHub
        uses: actions/checkout@v4

      # =====================================================
      # ETAPA 2 — SEMGREP SAST SCAN
      # =====================================================
      - name: Run Semgrep Security Scan

        # Scanner oficial Semgrep
        uses: semgrep/semgrep-action@v1

        with:

          # Regras automáticas da comunidade
          #
          # Detecta:
          # - SQL Injection
          # - Command Injection
          # - hardcoded secrets
          # - vulnerabilidades OWASP
          # - padrões inseguros
          config: auto

          # Geração de relatório SARIF
          #
          # Integração:
          # GitHub Security Tab
          # Code Scanning Alerts
          generateSarif: "1"

        env:

          # Token opcional Semgrep Platform
          #
          # Caso não exista secret configurado,
          # o pipeline continuará funcionando.
          #
          # Configuração no GitHub:
          # Settings
          # -> Secrets and variables
          # -> Actions
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # =====================================================
      # ETAPA 3 — UPLOAD SARIF PARA GITHUB SECURITY
      # =====================================================
      - name: Upload Semgrep SARIF Results

        uses: github/codeql-action/upload-sarif@v3

        with:

          # Arquivo gerado pelo Semgrep
          sarif_file: semgrep.s