name: SAST Security Scan

# =========================================================
# VARIÁVEIS GLOBAIS
# =========================================================
env:

  # Compatibilidade com GitHub Actions runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# =========================================================
# EVENTOS QUE DISPARAM O PIPELINE
# =========================================================
on:

  # Execução manual
  workflow_dispatch:

  # Executa automaticamente em pushes
  push:
    branches:
      - main
      - feature/babelfish-migration-validation

  # Executa automaticamente em Pull Requests
  pull_request:
    branches:
      - main

# =========================================================
# JOBS
# =========================================================
jobs:

  sast:

    # Nome exibido no GitHub Actions
    name: Static Application Security Testing

    # Runner oficial Ubuntu
    runs-on: ubuntu-latest

    # =====================================================
    # PERMISSÕES
    # =====================================================
    permissions:

      # Permissão mínima necessária para leitura do repositório
      contents: read

      # Necessário para integração segura entre actions
      actions: read

      # Necessário para leitura de eventos de segurança
      security-events: write

    # =====================================================
    # ETAPAS
    # =====================================================
    steps:

      # =====================================================
      # ETAPA 1 — CHECKOUT DO REPOSITÓRIO
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # ETAPA 2 — DEBUG CONTEXT
      # =====================================================
      - name: Debug GitHub Context

        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref }}
          GITHUB_EVENT_TYPE: ${{ github.event_name }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}

        run: |

          echo "========================================="
          echo "DEBUG GITHUB CONTEXT"
          echo "========================================="

          echo ""
          echo "Repository:"
          echo "$GITHUB_REPOSITORY_NAME"

          echo ""
          echo "Ref:"
          echo "$GITHUB_REF_NAME"

          echo ""
          echo "Event:"
          echo "$GITHUB_EVENT_TYPE"

          echo ""
          echo "Actor:"
          echo "$GITHUB_ACTOR_NAME"

          echo ""
          echo "Status:"
          echo "GitHub Context validado com sucesso."

          echo "========================================="

      # =====================================================
      # ETAPA 3 — EXECUTAR SAST COM SEMGREP
      # =====================================================
      - name: Run Semgrep Security Scan

        uses: semgrep/semgrep-action@v1

        with:

          # Regras automáticas da comunidade Semgrep
          config: auto

        env:

          # Token opcional para integração com Semgrep Cloud Platform
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # =====================================================
      # ETAPA 4 — STATUS FINAL
      # =====================================================
      - name: Validate SAST Execution

        run: |

          echo "========================================="
          echo "VALIDANDO EXECUÇÃO SAST"
          echo "========================================="

          echo ""
          echo "Status:"
          echo "Pipeline SAST executado com sucesso."

          echo ""
          echo "Ferramenta:"
          echo "Semgrep Security Scanner"

          echo ""
          echo "Resultado:"
          echo "Análise estática concluída."

          echo "========================================="