version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

    volumes:
      - sql_data:/var/opt/mssql

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

volumes:
  sql_data: