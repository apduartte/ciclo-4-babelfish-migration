
services:
  babelfish:
    image: public.ecr.aws/aws-compatibility/babelfish-for-postgresql:latest
    container_name: babelfish-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: babelfish
      BABELFISH_PASSWORD: postgres

    ports:
      - "5432:5432"
      - "1433:1433"

    volumes:
      - babelfish_data:/var/lib/postgresql/data

volumes:
  babelfish_data:
